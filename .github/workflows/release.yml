name: Build and Release

on:
  push:
    branches: [tmp/dry-run-sdk-workflow]

jobs:
  release:
    permissions:
      contents: write
    uses: msantoro12/StarRupture-Plugin-SDK/.github/workflows/plugin-release.yml@gss/sdk-release-workflow
    with:
      plugin_name: WaveOptimiser
      solution_file: WaveOptimiser_Plugin.sln
      dll_name: WaveOptimiser_Plugin
      release_title: WaveOptimiser Plugin
      server_build: true
      # Global (v3 API) id of the mod page: GET /v3/games/starrupture/mods/130 -> data.id
      nexus_mod_id: '37074157699202'
      sdk_repository: msantoro12/StarRupture-Plugin-SDK
      sdk_ref: gss/sdk-release-workflow
      dry_run: true
    secrets: inherit
